services:
  server:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production

      # Container connects to the Compose PostgreSQL service
      DATABASE_URL: postgresql://PSUSER@db:5432/action_plan

    # Start DB before the app
    depends_on:
      db:
        condition: service_healthy

    # Host 3012 → container 3000
    ports:
      - "3012:3000"

  db:
    image: postgres:16-alpine
    restart: always

    environment:
      POSTGRES_USER: PSUSER
      POSTGRES_DB: action_plan
      POSTGRES_HOST_AUTH_METHOD: trust

    # Persist database data
    volumes:
      - db-data:/var/lib/postgresql/data

    # Host 5433 → container 5432
    ports:
      - "5433:5432"

    # Don't start server until PostgreSQL is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PSUSER -d action_plan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: